<style>

const PW_HASH = 'a37ddc209a22a1c3912546bf963d878b258363129a9a07a0730a9ef8555724f7';

// --- Password ---
async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function doUnlock() {
  const val = document.getElementById('pw-input').value;
  const hash = await sha256(val);
  if (hash === PW_HASH) {
    document.getElementById('pw-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    localStorage.setItem('mumei-hub-auth', PW_HASH);
    init();
  } else {
    document.getElementById('pw-err').textContent = 'incorrect';
    document.getElementById('pw-input').value = '';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doUnlock();
});

// Auto-login
(async () => {
  if (localStorage.getItem('mumei-hub-auth') === PW_HASH) {
    document.getElementById('pw-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  }
})();

// --- State ---
function getStatus() {
  return JSON.parse(localStorage.getItem('mumei-hub-status') || '{}');
}
function setStatus(key, val) {
  const s = getStatus();
  s[key] = val;
  localStorage.setItem('mumei-hub-status', JSON.stringify(s));
}
function getCalStatus(day) {
  return getStatus()['cal-' + day] || 'pending';
}
function getEpPlatformStatus(ep, platform) {
  return getStatus()['ep-' + ep + '-' + platform] || 'pending';
}

// --- Toast ---
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// --- Copy ---
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied!')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Copied!');
  });
}

document.querySelectorAll('.tab-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// --- Render Calendar ---
function renderCalendar() {
  const el = document.getElementById('tab-calendar');
  let html = '<h2 style="font-size:1.1rem;margin-bottom:12px">Distribution Calendar</h2>';
  let lastPhase = 0;

  SCHEDULE.forEach(s => {
    if (s.phase !== lastPhase) {
      html += `<div class="phase-header phase-${s.phase}">${s.phaseLabel}</div>`;
      lastPhase = s.phase;
    }

    const ep = s.ep ? EPISODES.find(e => e.num === s.ep) : null;
    const title = ep ? `EP${ep.num} "${ep.title}" ${ep.emotion}` : (s.label || 'Compilation');
    const meta = s.time + ' | ' + s.platforms.map(p => p === 'instagram' ? 'IG' : p === 'youtube' ? 'YT' : 'X').join(' + ');
    const statusKey = 'cal-' + s.day;
    const status = getCalStatus(s.day);

    html += `<div class="cal-card">
      <div class="cal-day">
        <div class="num">${s.day}</div>
        <div class="label">Day</div>
      </div>
      <div class="cal-info">
        <div class="title">${title}</div>
        <div class="meta">${meta}</div>
      </div>
      <div class="cal-platforms">
        ${s.platforms.map(p => `<div class="dot" style="background:var(--${p})"></div>`).join('')}
      </div>
      <button class="cal-status ${status}" onclick="toggleCalStatus(${s.day},this)">
        ${status === 'posted' ? 'Posted' : 'Pending'}
      </button>
    </div>`;
  });

  el.innerHTML = html;
}

function toggleCalStatus(day, btn) {
  const current = getCalStatus(day);
  const next = current === 'pending' ? 'posted' : 'pending';
  setStatus('cal-' + day, next);
  btn.className = 'cal-status ' + next;
  btn.textContent = next === 'posted' ? 'Posted' : 'Pending';
  renderStats();
}

      ig: ep.ig,
      yt: ep.ytTitle + '\n\n' + ep.ytDesc,
      x: ep.x
    };

    html += `<div class="ep-card" id="ep-card-${ep.num}">
      <div class="ep-header">
        <div class="ep-num" style="background:${ep.color}">${ep.num}</div>
        <div class="ep-title-block">
          <h3>${ep.emotion} ${ep.title} (${ep.enTitle})</h3>
          <div class="sub">${ep.duration}s | ${ep.emotionLabel}</div>
        </div>
      </div>
      <div class="ep-chars">
        ${ep.characters.map(c => `<span>${c}</span>`).join('')}
      </div>
      <div class="platform-tabs">
        <button class="active" onclick="switchPlatform(${ep.num},'ig',this)" style="color:var(--ig)">Instagram</button>
        <button onclick="switchPlatform(${ep.num},'yt',this)" style="color:var(--yt)">YouTube</button>
        <button onclick="switchPlatform(${ep.num},'x',this)" style="color:var(--x)">X</button>
      </div>
      <div class="caption-area" id="caption-${ep.num}">
        <div class="caption-text" id="caption-text-${ep.num}">${ep.ig}</div>
      </div>
      ${ep.num ? `<div class="x-count" id="x-count-${ep.num}" style="display:none">${ep.xCount}/280 weighted chars</div>` : ''}
      <div class="caption-actions" id="actions-${ep.num}">
        <button class="btn-copy" onclick="copyCaption(${ep.num})">Copy</button>
        <button class="btn-post btn-ig" id="post-btn-${ep.num}" onclick="openPlatform(${ep.num})">Copy & Open IG</button>
      </div>
      <div class="ep-status-row">
        <button class="ep-status-btn ${getEpPlatformStatus(ep.num,'ig')}" onclick="toggleEpStatus(${ep.num},'ig',this)">
          IG: ${getEpPlatformStatus(ep.num,'ig') === 'posted' ? 'Posted' : 'Pending'}
        </button>
        <button class="ep-status-btn ${getEpPlatformStatus(ep.num,'yt')}" onclick="toggleEpStatus(${ep.num},'yt',this)">
          YT: ${getEpPlatformStatus(ep.num,'yt') === 'posted' ? 'Posted' : 'Pending'}
        </button>
        <button class="ep-status-btn ${getEpPlatformStatus(ep.num,'x')}" onclick="toggleEpStatus(${ep.num},'x',this)">
          X: ${getEpPlatformStatus(ep.num,'x') === 'posted' ? 'Posted' : 'Pending'}
        </button>
      </div>
    </div>`;
  });

  el.innerHTML = html;
}

// Track active platform per episode
const activePlatform = {};
EPISODES.forEach(e => activePlatform[e.num] = 'ig');

function switchPlatform(epNum, platform, btn) {
  activePlatform[epNum] = platform;
  const ep = EPISODES.find(e => e.num === epNum);
  const card = document.getElementById('ep-card-' + epNum);
  card.querySelectorAll('.platform-tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const captions = { ig: ep.ig, yt: ep.ytTitle + '\n\n' + ep.ytDesc, x: ep.x };
  document.getElementById('caption-text-' + epNum).textContent = captions[platform];

  const xCount = document.getElementById('x-count-' + epNum);
  if (platform === 'x') {
    xCount.style.display = 'block';
  } else {
    xCount.style.display = 'none';
  }

  const postBtn = document.getElementById('post-btn-' + epNum);
  if (platform === 'ig') {
    postBtn.className = 'btn-post btn-ig';
    postBtn.textContent = 'Copy & Open IG';
  } else if (platform === 'yt') {
    postBtn.className = 'btn-post btn-yt';
    postBtn.textContent = 'Copy & Open YT';
  } else {
    postBtn.className = 'btn-post btn-x';
    postBtn.textContent = 'Copy & Open X';
  }
}

function copyCaption(epNum) {
  const text = document.getElementById('caption-text-' + epNum).textContent;
  copyText(text);
}

function openPlatform(epNum) {
  const ep = EPISODES.find(e => e.num === epNum);
  const platform = activePlatform[epNum];
  const captions = { ig: ep.ig, yt: ep.ytTitle + '\n\n' + ep.ytDesc, x: ep.x };
  copyText(captions[platform]);

  const urls = {
    ig: 'https://www.instagram.com/',
    yt: 'https://studio.youtube.com/',
    x: 'https://twitter.com/compose/tweet'
  };
  setTimeout(() => window.open(urls[platform], '_blank'), 300);
}

function toggleEpStatus(epNum, platform, btn) {
  const current = getEpPlatformStatus(epNum, platform);
  const next = current === 'pending' ? 'posted' : 'pending';
  setStatus('ep-' + epNum + '-' + platform, next);
  btn.className = 'ep-status-btn ' + next;
  const labels = { ig: 'IG', yt: 'YT', x: 'X' };
  btn.textContent = labels[platform] + ': ' + (next === 'posted' ? 'Posted' : 'Pending');
  renderStats();
}

// --- Render Stats ---
function renderStats() {
  const el = document.getElementById('tab-stats');
  let posted = 0;
  const total = 27; // 9 eps x 3 platforms
  const platforms = { ig: 0, yt: 0, x: 0 };

  EPISODES.forEach(ep => {
    ['ig', 'yt', 'x'].forEach(p => {
      if (getEpPlatformStatus(ep.num, p) === 'posted') {
        posted++;
        platforms[p]++;
      }
    });
  });

  const pct = Math.round((posted / total) * 100);

  let tableRows = '';
  EPISODES.forEach(ep => {
    const igS = getEpPlatformStatus(ep.num, 'ig');
    const ytS = getEpPlatformStatus(ep.num, 'yt');
    const xS = getEpPlatformStatus(ep.num, 'x');
    tableRows += `<tr>
      <td>EP${ep.num} ${ep.emotion} ${ep.title}</td>
      <td><span class="status-dot ${igS}"></span></td>
      <td><span class="status-dot ${ytS}"></span></td>
      <td><span class="status-dot ${xS}"></span></td>
    </tr>`;
  });

  el.innerHTML = `
    <h2 style="font-size:1.1rem;margin-bottom:12px">Distribution Progress</h2>
    <div class="stats-overview">
      <div class="big">${posted}/${total}</div>
      <div class="label">Episodes Posted</div>
      <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="num" style="color:var(--ig)">${platforms.ig}/9</div>
        <div class="lbl">Instagram</div>
      </div>
      <div class="stat-card">
        <div class="num" style="color:var(--yt)">${platforms.yt}/9</div>
        <div class="lbl">YouTube</div>
      </div>
      <div class="stat-card">
        <div class="num" style="color:var(--x)">${platforms.x}/9</div>
        <div class="lbl">X (Twitter)</div>
      </div>
    </div>
    <div class="ep-status-table">
      <h3>Episode Status Matrix</h3>
      <table>
        <tr><th>Episode</th><th style="color:var(--ig)">IG</th><th style="color:var(--yt)">YT</th><th>X</th></tr>
        ${tableRows}
      </table>
    </div>
  `;
}
